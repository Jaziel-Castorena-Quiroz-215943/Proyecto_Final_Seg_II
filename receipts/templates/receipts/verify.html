{% extends 'accounts/base.html' %}
{% block title %}Verificar comprobante{% endblock %}
{% block content %}
<h1>Verificar comprobante</h1>
{% if verified %}<p>Firma válida y comprobante íntegro.</p><a href="{% url 'receipts:detail' receipt.pk %}">Ver comprobante</a>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Verificar</button>
</form>
{% endblock %}
