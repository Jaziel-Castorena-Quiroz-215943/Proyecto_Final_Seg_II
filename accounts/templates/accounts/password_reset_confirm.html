{% extends 'accounts/base.html' %}
{% block content %}
<h1>Restablecer contraseña</h1>
{% if validlink %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Cambiar contraseña</button>
</form>
{% else %}
<p>El enlace no es válido o ha caducado. Solicita uno nuevo.</p>
{% endif %}
{% endblock %}
