{% extends 'accounts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Enviar</button>
</form>
{% if title == 'Iniciar sesión' %}<a href="{% url 'accounts:password_reset' %}">¿Olvidaste tu contraseña?</a>{% endif %}
{% endblock %}
